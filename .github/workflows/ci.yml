name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check

      - name: Build (validates the content first)
        run: npm run build

      - name: Smoke tests on a phone and a desktop
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Lighthouse budgets (mobile)
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
